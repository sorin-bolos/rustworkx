[package]
name = "rustworkx"
description = "A python graph library implemented in Rust"
readme = "README.md"
keywords = ["python", "graph"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
# Feature flag for WebAssembly compilation - updated to use correct PyO3 WASM feature
wasm = ["pyo3/extension-module", "pyo3/abi3-py39"]

[workspace]
members = [
    "rustworkx-core",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
rust-version = "1.79"
authors = ["Matthew Treinish <mtreinish@kortar.org>"]
repository = "https://github.com/Qiskit/rustworkx"
license = "Apache-2.0"

[workspace.dependencies]
ahash = "0.8.6"
fixedbitset = "0.5.7"
# Conditionally enable rayon feature based on wasm feature
indexmap = { version = ">=1.9, <3" }
ndarray = { version = "0.16.1" }
num-traits = "0.2"
petgraph = "0.7.0"
hashbrown = "0.15.2"
numpy = "0.23"
rand = { version = "0.8", features = ["small_rng"] }
rand_pcg = "0.3"
rayon = "1.10"

[lib]
name = "rustworkx"
crate-type = ["cdylib"]

[dependencies]
ahash.workspace = true
fixedbitset.workspace = true
# Updated hashbrown to specify version directly without non-existent features
hashbrown = "0.15.2"
indexmap.workspace = true
ndarray.workspace = true
ndarray-stats = "0.6.0"
num-bigint = "0.4"
num-complex = "0.4"
num-traits.workspace = true
numpy.workspace = true
petgraph.workspace = true
quick-xml = "0.37"
rand.workspace = true
rand_pcg.workspace = true
rayon = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.0", features = ["union"] }
rustworkx-core = { path = "rustworkx-core", version = "=0.17.0" }
flate2 = "1.0.35"

# Enable rayon features only when not targeting WebAssembly
[target.'cfg(not(feature = "wasm"))'.dependencies]
rayon = { workspace = true }
# Updated hashbrown to only include rayon feature
hashbrown = { version = "0.15.2", features = ["rayon"] }
indexmap = { workspace = true, features = ["rayon"] }
ndarray = { workspace = true, features = ["rayon"] }

[dependencies.pyo3]
version = "0.23"
features = ["abi3-py39", "extension-module", "hashbrown", "num-bigint", "num-complex", "indexmap", "py-clone"]

[dependencies.sprs]
version = "^0.11"
default-features = false
features = ["multi_thread"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Special configuration for WASM builds
[target.wasm32-unknown-emscripten.dependencies]
rayon = { version = "1.10", optional = true }
hashbrown = { version = "0.15.2" }
indexmap = { version = ">=1.9, <3" }
ndarray = { version = "0.16.1" }

[target.wasm32-unknown-emscripten.profile.release]
lto = "thin"
codegen-units = 16
opt-level = 1
