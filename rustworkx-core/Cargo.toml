[package]
name = "rustworkx-core"
description = "Rust APIs used for rustworkx algorithms"
readme = "README.md"
keywords = ["graph"]
homepage = "https://github.com/Qiskit/rustworkx/tree/main/rustworkx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
# Feature flag for WebAssembly compilation
wasm = []

[dependencies]
ahash.workspace = true
fixedbitset.workspace = true
hashbrown = { workspace = true, features = ["raw"] }
indexmap.workspace = true
ndarray.workspace = true
num-traits.workspace = true
petgraph.workspace = true
priority-queue = "2.1"
rand.workspace = true
rand_pcg.workspace = true
rayon = { workspace = true, optional = true }
rayon-cond = "0.3"

# Enable rayon features only when not targeting WebAssembly
[target.'cfg(not(feature = "wasm"))'.dependencies]
hashbrown = { workspace = true, features = ["raw", "rayon"] }
indexmap = { workspace = true, features = ["rayon"] }
ndarray = { workspace = true, features = ["rayon"] }
rayon = { workspace = true }
