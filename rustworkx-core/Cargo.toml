[package]
name = "rustworkx-core"
description = "Rust APIs used for rustworkx algorithms"
readme = "README.md"
keywords = ["graph"]
homepage = "https://github.com/Qiskit/rustworkx/tree/main/rustworkx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:getrandom"
]
default = []
parallel = [
    "rayon",
    "rayon-cond",
    "indexmap/rayon",
    "ndarray/rayon",
    "hashbrown/rayon"
]

[dependencies]
ahash.workspace = true
fixedbitset.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
ndarray.workspace = true
num-traits.workspace = true
petgraph.workspace = true
priority-queue = "2.1"
rand.workspace = true
rand_pcg.workspace = true
rayon = { workspace = true, optional = true }
rayon-cond = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.87", optional = true }
js-sys = { version = "0.3.64", optional = true }
web-sys = { version = "0.3.64", features = ["console"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
rayon-cond = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.features]
default = ["parallel"]

[target.'cfg(target_arch = "wasm32")'.features]
default = ["wasm"]

