<!DOCTYPE html>
<html>
<head>
    <title>Rustworkx in Pyodide Test</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
    <h2>Testing Rustworkx in Pyodide</h2>
    <div id="output" style="white-space: pre-wrap; font-family: monospace;"></div>
    
    <script type="text/javascript">
        async function main() {
            let output = document.getElementById("output");
            output.textContent = "Loading Pyodide...\n";
            
            // Load Pyodide
            const pyodide = await loadPyodide();
            output.textContent += "Pyodide loaded. Loading rustworkx...\n";
            
            // Load rustworkx package
            // You need to serve the files from the pyodide directory
            await pyodide.loadPackage("./rustworkx");
            
            output.textContent += "Rustworkx loaded. Running tests...\n\n";
            
            // Run a test
            try {
                const result = await pyodide.runPythonAsync(`
                    import rustworkx as rx
                    import sys
                    
                    output = []
                    output.append(f"Python version: {sys.version}")
                    output.append(f"Rustworkx version: {rx.__version__}")
                    
                    # Create a simple graph
                    g = rx.PyGraph()
                    n1 = g.add_node("Node 1")
                    n2 = g.add_node("Node 2")
                    g.add_edge(n1, n2, "Edge 1-2")
                    
                    output.append(f"Graph created with {g.node_count()} nodes and {g.edge_count()} edge")
                    output.append(f"Graph is connected: {g.is_connected()}")
                    
                    # Create a directed graph
                    dg = rx.PyDiGraph()
                    n1 = dg.add_node("Node 1")
                    n2 = dg.add_node("Node 2")
                    n3 = dg.add_node("Node 3")
                    dg.add_edge(n1, n2, "Edge 1→2")
                    dg.add_edge(n2, n3, "Edge 2→3")
                    
                    output.append(f"DiGraph created with {dg.node_count()} nodes and {dg.edge_count()} edges")
                    
                    "\\n".join(output)
                `);
                
                output.textContent += result;
                output.textContent += "\n\nTests completed successfully!";
            } catch (error) {
                output.textContent += "Error running tests:\n" + error;
                console.error(error);
            }
        }
        
        main();
    </script>
</body>
</html>
