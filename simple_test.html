<!DOCTYPE html>
<html>
<head>
    <title>Simple Rustworkx WebAssembly Test</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
    <h2>Testing Rustworkx WebAssembly</h2>
    <div id="output" style="white-space: pre-wrap; font-family: monospace;"></div>
    
    <script type="text/javascript">
        async function main() {
            const output = document.getElementById("output");
            output.textContent = "Loading Pyodide...\n";
            
            // Load Pyodide
            const pyodide = await loadPyodide();
            output.textContent += "Pyodide loaded.\n";
            
            try {
                // Load the WASM module directly from JavaScript
                output.textContent += "Loading WASM module...\n";
                
                // Import the WASM module
                const rustworkxModule = await import('./rustworkx_wasm.js');
                const wasmBytes = await fetch('./rustworkx_wasm.wasm').then(r => r.arrayBuffer());
                await rustworkxModule.default(wasmBytes);
                
                // Make rustwokx_wasm available globally
                globalThis.rustworkx_wasm = {
                    PyGraph: {
                        new: function() { 
                            return new rustworkxModule.PyGraph(); 
                        }
                    },
                    PyDiGraph: {
                        new: function() { 
                            return new rustworkxModule.PyDiGraph(); 
                        }
                    }
                };
                
                // Add the necessary methods
                const graph = new rustworkxModule.PyGraph();
                globalThis.rustworkx_wasm.PyGraph.add_node = function(instance, data) {
                    return instance.add_node(data);
                };
                globalThis.rustworkx_wasm.PyGraph.add_edge = function(instance, source, target, data) {
                    return instance.add_edge(source, target, data);
                };
                globalThis.rustworkx_wasm.PyGraph.node_count = function(instance) {
                    return instance.node_count();
                };
                globalThis.rustworkx_wasm.PyGraph.edge_count = function(instance) {
                    return instance.edge_count();
                };
                globalThis.rustworkx_wasm.PyGraph.is_connected = function(instance) {
                    return instance.is_connected();
                };
                
                const digraph = new rustworkxModule.PyDiGraph();
                globalThis.rustworkx_wasm.PyDiGraph.add_node = function(instance, data) {
                    return instance.add_node(data);
                };
                globalThis.rustworkx_wasm.PyDiGraph.add_edge = function(instance, source, target, data) {
                    return instance.add_edge(source, target, data);
                };
                globalThis.rustworkx_wasm.PyDiGraph.node_count = function(instance) {
                    return instance.node_count();
                };
                globalThis.rustworkx_wasm.PyDiGraph.edge_count = function(instance) {
                    return instance.edge_count();
                };
                
                output.textContent += "WASM module loaded and initialized.\n";
                
                // Now create a simple package directly
                output.textContent += "Creating Python package...\n";
                
                // Create the Python implementation
                await pyodide.runPythonAsync(`
import sys
from js import rustworkx_wasm

# Create the rustworkx package
sys.modules['rustworkx'] = type('rustworkx', (), {})
rustworkx = sys.modules['rustworkx']
rustworkx.__version__ = '0.17.0'

# Create the PyGraph class
class PyGraph:
    def __init__(self):
        self._graph = rustworkx_wasm.PyGraph.new()
    
    def add_node(self, data):
        return rustworkx_wasm.PyGraph.add_node(self._graph, data)
    
    def add_edge(self, source, target, data):
        return rustworkx_wasm.PyGraph.add_edge(self._graph, source, target, data)
    
    def node_count(self):
        return rustworkx_wasm.PyGraph.node_count(self._graph)
    
    def edge_count(self):
        return rustworkx_wasm.PyGraph.edge_count(self._graph)
    
    def is_connected(self):
        return rustworkx_wasm.PyGraph.is_connected(self._graph)

# Create the PyDiGraph class
class PyDiGraph:
    def __init__(self):
        self._graph = rustworkx_wasm.PyDiGraph.new()
    
    def add_node(self, data):
        return rustworkx_wasm.PyDiGraph.add_node(self._graph, data)
    
    def add_edge(self, source, target, data):
        return rustworkx_wasm.PyDiGraph.add_edge(self._graph, source, target, data)
    
    def node_count(self):
        return rustworkx_wasm.PyDiGraph.node_count(self._graph)
    
    def edge_count(self):
        return rustworkx_wasm.PyDiGraph.edge_count(self._graph)

# Create simple graph generators
def path_graph(n, bidirectional=False):
    if bidirectional:
        g = PyDiGraph()
        for i in range(n):
            g.add_node(None)
        for i in range(n-1):
            g.add_edge(i, i+1, None)
            g.add_edge(i+1, i, None)
        return g
    else:
        g = PyGraph()
        for i in range(n):
            g.add_node(None)
        for i in range(n-1):
            g.add_edge(i, i+1, None)
        return g

def cycle_graph(n, bidirectional=False):
    if n < 3:
        raise ValueError("Cycle graph must have at least 3 nodes")
    
    if bidirectional:
        g = PyDiGraph()
        for i in range(n):
            g.add_node(None)
        for i in range(n-1):
            g.add_edge(i, i+1, None)
            g.add_edge(i+1, i, None)
        g.add_edge(n-1, 0, None)
        g.add_edge(0, n-1, None)
        return g
    else:
        g = PyGraph()
        for i in range(n):
            g.add_node(None)
        for i in range(n-1):
            g.add_edge(i, i+1, None)
        g.add_edge(n-1, 0, None)
        return g

def complete_graph(n, bidirectional=False):
    if bidirectional:
        g = PyDiGraph()
        for i in range(n):
            g.add_node(None)
        for i in range(n):
            for j in range(n):
                if i != j:
                    g.add_edge(i, j, None)
        return g
    else:
        g = PyGraph()
        for i in range(n):
            g.add_node(None)
        for i in range(n):
            for j in range(i+1, n):
                g.add_edge(i, j, None)
        return g

# Add classes and functions to the module
rustworkx.PyGraph = PyGraph
rustworkx.PyDiGraph = PyDiGraph
rustworkx.path_graph = path_graph
rustworkx.cycle_graph = cycle_graph
rustworkx.complete_graph = complete_graph

print("rustworkx module created successfully")
                `);
                
                // Test the package
                const result = await pyodide.runPythonAsync(`
import rustworkx as rx

# Test basic functionality
output = []
output.append(f"Rustworkx version: {rx.__version__}")

# Create a simple graph
g = rx.PyGraph()
n1 = g.add_node("Node 1")
n2 = g.add_node("Node 2")
e = g.add_edge(n1, n2, "Edge 1-2")

output.append(f"Created graph with {g.node_count()} nodes and {g.edge_count()} edge")
output.append(f"Graph is connected: {g.is_connected()}")

# Create a directed graph
dg = rx.PyDiGraph()
n1 = dg.add_node("Node 1")
n2 = dg.add_node("Node 2")
n3 = dg.add_node("Node 3")
e1 = dg.add_edge(n1, n2, "Edge 1->2")
e2 = dg.add_edge(n2, n3, "Edge 2->3")

output.append(f"DiGraph created with {dg.node_count()} nodes and {dg.edge_count()} edges")

# Test generators
path = rx.path_graph(5)
output.append(f"Path graph has {path.node_count()} nodes and {path.edge_count()} edges")

cycle = rx.cycle_graph(6)
output.append(f"Cycle graph has {cycle.node_count()} nodes and {cycle.edge_count()} edges")

complete = rx.complete_graph(4)
output.append(f"Complete graph has {complete.node_count()} nodes and {complete.edge_count()} edges")

"\\n".join(output)
                `);
                
                output.textContent += result;
                output.textContent += "\n\nTests completed successfully!";
            } catch (error) {
                output.textContent += "Error: " + error + "\n";
                console.error(error);
            }
        }
        
        main();
    </script>
</body>
</html>
