<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rustworkx Pyodide Test</title>
    <!-- Use Pyodide 0.25.0 which is the version our wheel was built for -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
</head>
<body>
    <h1>RustWorkX WebAssembly Test</h1>
    <button id="runButton">Run Test</button>
    <pre id="output"></pre>

    <script type="text/javascript">
        const output = document.getElementById('output');
        const runButton = document.getElementById('runButton');

        function addToOutput(text) {
            output.textContent += text + '\n';
        }

        async function main() {
            addToOutput("Loading pyodide...");
            let pyodide = await loadPyodide();
            addToOutput("Pyodide loaded successfully!");

            // Get pyodide version for debugging
            const pyodideVersion = await pyodide.runPythonAsync(`
                import pyodide
                pyodide.__version__
            `);
            addToOutput("Pyodide version: " + pyodideVersion);

            addToOutput("Installing micropip...");
            await pyodide.loadPackage("micropip");
            addToOutput("Micropip installed!");

            // Load the wheel file
            addToOutput("Loading numpy...");
            await pyodide.loadPackage("numpy"); // Required dependency
            addToOutput("numpy loaded!");
            
            try {

                addToOutput("Loading rustworkx...");
                // Use the exact wheel file we built with platform adaptation
                const wheelPath = "http://localhost:8000/dist/rustworkx-0.17.0-cp39-abi3-pyodide_2024_0_wasm32.whl";

                // Install the wheel
                await pyodide.runPythonAsync(`
                    import micropip
                    await micropip.install("${wheelPath}")
                    print("Rustworkx installed!")
                `);
                addToOutput("Rustworkx installed successfully!");
                

                // Run a simple test using rustworkx
                const result = await pyodide.runPythonAsync(`
                    import rustworkx as rx
                    import sys
                    
                    # Create a simple graph
                    graph = rx.PyGraph()
                    node_a = graph.add_node("A")
                    node_b = graph.add_node("B")
                    node_c = graph.add_node("C")
                    
                    # Add edges
                    graph.add_edge(node_a, node_b, "A-B")
                    graph.add_edge(node_b, node_c, "B-C")
                    
                    # Get information about the graph
                    result = {
                        "num_nodes": len(graph),
                        "num_edges": graph.num_edges(),
                        "nodes": [graph.get_node_data(n) for n in range(len(graph))],
                        "edges": [graph.get_edge_data(e[0], e[1]) for e in graph.edge_list()]
                    }
                    
                    result_str = str(result)
                    result_str
                `);
                
                addToOutput("Test result: " + result);
                addToOutput("Test completed successfully!");
                
            } catch (error) {
                addToOutput("Error: " + error);
                console.error(error);
                
                // Try to provide more detailed error information
                try {
                    // Get installed packages
                    const packages = await pyodide.runPythonAsync(`
                        import micropip
                        micropip.list()
                    `);
                    addToOutput("Installed packages: " + packages);
                    
                    // Check if the wheel file exists
                    const wheelExists = await pyodide.runPythonAsync(`
                        import os
                        os.path.exists("./dist/rustworkx-0.17.0-cp39-abi3-pyodide_2025_0_wasm32.whl")
                    `);
                    addToOutput("Wheel file exists: " + wheelExists);
                    
                    // List files in dist directory
                    const distFiles = await pyodide.runPythonAsync(`
                        import os
                        os.path.exists("./dist") and os.listdir("./dist")
                    `);
                    addToOutput("Files in dist directory: " + distFiles);
                } catch (innerError) {
                    addToOutput("Error getting additional info: " + innerError);
                }
            }
        }

        runButton.addEventListener('click', () => {
            output.textContent = ""; // Clear previous output
            main();
        });
    </script>
</body>
</html>
