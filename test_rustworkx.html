<!DOCTYPE html>
<html>
<head>
    <title>Rustworkx in Pyodide Test</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="./build/wasm/rustworkx_wasm.js"></script>
</head>
<body>
    <h2>Testing Rustworkx in Pyodide</h2>
    <div id="output" style="white-space: pre-wrap; font-family: monospace;"></div>
    
    <script type="text/javascript">
        async function main() {
            const output = document.getElementById("output");
            output.textContent = "Loading Pyodide...\n";
            
            // Load Pyodide
            const pyodide = await loadPyodide();
            output.textContent += "Pyodide loaded.\n";
            
            try {
                // First load the WASM module
                output.textContent += "Loading WASM module...\n";
                const wasmResponse = await fetch('./build/wasm/rustworkx_wasm_bg.wasm');
                if (!wasmResponse.ok) {
                    throw new Error(`Failed to fetch WASM: ${wasmResponse.statusText}`);
                }
                
                const wasmBytes = await wasmResponse.arrayBuffer();
                
                // Initialize the WASM module
                await rustworkx_wasm(wasmBytes);
                
                // Register it with Pyodide
                pyodide.registerJsModule("rustworkx_wasm", rustworkx_wasm);
                output.textContent += "WASM module loaded and registered.\n";
                
                // Install micropip
                await pyodide.loadPackage("micropip");
                output.textContent += "Installed micropip.\n";
                
                // Now try to import rustworkx
                const result = await pyodide.runPythonAsync(`
import sys
import os

try:
    # Check the JS module is available
    from js import rustworkx_wasm
    print("JS module loaded successfully")
    
    # Now try to load rustworkx from the filesystem
    sys.path.append('./build/pyodide')
    import rustworkx as rx
    print(f"Successfully imported rustworkx version: {rx.__version__}")
    
    # Test basic functionality
    g = rx.PyGraph()
    n1 = g.add_node("Node 1")
    n2 = g.add_node("Node 2")
    g.add_edge(n1, n2, "Edge 1-2")
    
    print(f"Created graph with {g.node_count()} nodes and {g.edge_count()} edge")
    print(f"Graph is connected: {g.is_connected()}")
    
    "Tests completed successfully!"
except Exception as e:
    import traceback
    print(f"Error: {e}")
    print(traceback.format_exc())
                `);
                
                output.textContent += result;
            } catch (error) {
                output.textContent += "Error: " + error;
                console.error(error);
            }
        }
        
        main();
    </script>
</body>
</html>
