[package]
name = "rustworkx-wasm"
version = "0.17.0"
edition = "2021"
description = "WebAssembly build of rustworkx core algorithms"
authors = ["Matthew Treinish <mtreinish@kortar.org>"]
repository = "https://github.com/Qiskit/rustworkx"
license = "Apache-2.0"

[lib]
name = "rustworkx_wasm"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.87"
js-sys = "0.3.64"
web-sys = { version = "0.3.64", features = ["console"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
rustworkx-core = { path = "../rustworkx-core", features = ["wasm"] }
